<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#ffffff"/>

  <!-- Connection nodes -->
  <circle cx="8" cy="8" r="1.5" fill="#3b82f6"/>
  <circle cx="16" cy="6" r="1.5" fill="#6366f1"/>
  <circle cx="22" cy="12" r="1.5" fill="#3b82f6"/>
  <circle cx="18" cy="18" r="1.5" fill="#6366f1"/>
  <circle cx="10" cy="20" r="1.5" fill="#3b82f6"/>

  <!-- Connection lines -->
  <line x1="8" y1="8" x2="16" y2="6" stroke="#a5b4fc" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="6" x2="22" y2="12" stroke="#a5b4fc" stroke-width="1" opacity="0.7"/>
  <line x1="22" y1="12" x2="18" y2="18" stroke="#a5b4fc" stroke-width="1" opacity="0.7"/>
  <line x1="18" y1="18" x2="10" y2="20" stroke="#a5b4fc" stroke-width="1" opacity="0.7"/>
  <line x1="10" y1="20" x2="8" y2="8" stroke="#a5b4fc" stroke-width="1" opacity="0.7"/>

  <!-- Central circle -->
  <circle cx="14" cy="13" r="4" fill="none" stroke="url(#faviconGradient)" stroke-width="1"/>
</svg>
