<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Gradient background accent -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gradient1)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#gradient2)"/>

  <!-- Main title area -->
  <g id="title">
    <!-- "Mapa do Cuidado" -->
    <text x="100" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">
      Mapa do Cuidado
    </text>

    <!-- Subtitle: Escuta Participativa -->
    <text x="100" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#6b7280">
      Escuta Participativa
    </text>

    <!-- Description -->
    <text x="100" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#374151" letter-spacing="-0.01em">
      Compartilhe sua percepção sobre os caminhos do cuidado
    </text>

    <!-- Location/Region -->
    <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#6b7280">
      Noroeste Fluminense • 13 Municípios
    </text>
  </g>

  <!-- Right accent: geometric shapes representing territory/data -->
  <g id="accent-shapes" opacity="0.8">
    <!-- Circle 1 (top right) -->
    <circle cx="1050" cy="120" r="50" fill="none" stroke="#3b82f6" stroke-width="3"/>

    <!-- Circle 2 (middle right) -->
    <circle cx="1100" cy="280" r="35" fill="none" stroke="#6366f1" stroke-width="2"/>

    <!-- Circle 3 (bottom right) -->
    <circle cx="1040" cy="480" r="45" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- Connecting dots pattern -->
    <circle cx="900" cy="150" r="4" fill="#3b82f6"/>
    <circle cx="950" cy="200" r="4" fill="#6366f1"/>
    <circle cx="1000" cy="250" r="4" fill="#3b82f6"/>
    <circle cx="950" cy="350" r="4" fill="#6366f1"/>
    <circle cx="900" cy="450" r="4" fill="#3b82f6"/>
  </g>

  <!-- Footer: SyVtek branding -->
  <g id="footer">
    <text x="100" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#6b7280">
      mapa-do-cuidado-merco2026.vercel.app
    </text>

    <!-- SyVtek mark -->
    <text x="1000" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e40af">
      SyVtek Care
    </text>
  </g>

  <!-- Merco 2026 badge -->
  <g id="badge">
    <rect x="1000" y="40" width="170" height="60" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
    <text x="1085" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">
      Merco 2026
    </text>
  </g>
</svg>
