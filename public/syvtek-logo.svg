<svg viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo mark: stylized care/connection symbol -->
  <g>
    <!-- Main circle with gradient -->
    <defs>
      <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
      </linearGradient>
    </defs>

    <!-- Connection nodes - representing care pathways -->
    <circle cx="12" cy="12" r="2" fill="#3b82f6"/>
    <circle cx="22" cy="8" r="2" fill="#6366f1"/>
    <circle cx="28" cy="18" r="2" fill="#3b82f6"/>
    <circle cx="20" cy="24" r="2" fill="#6366f1"/>

    <!-- Connection lines - representing collaboration -->
    <line x1="12" y1="12" x2="22" y2="8" stroke="#a5b4fc" stroke-width="1.5" opacity="0.6"/>
    <line x1="22" y1="8" x2="28" y2="18" stroke="#a5b4fc" stroke-width="1.5" opacity="0.6"/>
    <line x1="28" y1="18" x2="20" y2="24" stroke="#a5b4fc" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="24" x2="12" y2="12" stroke="#a5b4fc" stroke-width="1.5" opacity="0.6"/>

    <!-- Central circle - representing heart/care -->
    <circle cx="20" cy="16" r="5.5" fill="none" stroke="url(#logoGradient)" stroke-width="1.5"/>
  </g>

  <!-- Text: SyVtek Care -->
  <text x="45" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1e293b">
    SyVtek Care
  </text>
  <text x="45" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#64748b">
    Mapa do Cuidado
  </text>
</svg>
